name: Check StudyHarbor
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dist/app.js
      - run: node --check dist/core.js
      - run: node --check scripts/serve.mjs
      - run: node --test tests/core.test.mjs
